<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio | Contact</title>
    <meta name="description" content="Contact me through my accessible contact form.">
    <meta name="author" content="Rashmika">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Get in Touch</h2>

            <p>
                Please fill out the form below to contact me.
            </p>

            <form action="#" method="post" aria-label="Contact form">

                <div>
                    <label for="name">Full Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        autocomplete="name">
                </div>

                <br>

                <div>
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email">
                </div>

                <br>

                <div>
                    <label for="subject">Subject:</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required>
                </div>

                <br>

                <div>
                    <label for="message">Message:</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required></textarea>
                </div>

                <br>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Personal Portfolio. All rights reserved.</p>
    </footer>

</body>
</html>
