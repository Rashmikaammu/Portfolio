<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio | Contact</title>

    <meta name="description"
        content="Contact Rashmika through the portfolio contact form.">

    <meta name="author" content="Rashmika">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <h1>Rashmika's Portfolio</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>

        <button id="themeToggle" type="button">🌙 Dark Mode</button>

    </header>

    <main>

        <section class="contact-section">

            <h2>Contact Me</h2>

            <form class="contact-form">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button class="submit-button" type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rashmika. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
